<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JJS 權限優化版轉發外掛</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; padding-top: 50px; }
        .box { background: #1e293b; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 12px; border: 2px solid #a855f7; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #a855f7; color: white; border: none; border-radius: 8px; font-weight: bold; margin-bottom: 20px; transition: 0.2s; }
        button:hover { background: #9333ea; }
        .status { font-size: 24px; color: #c084fc; font-weight: bold; margin: 20px 0; }
        .log { background: #000; color: #22c55e; padding: 15px; border-radius: 6px; text-align: left; height: 120px; overflow-y: auto; font-family: monospace; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔮 JJS 領域展開：GitHub 高權限轉發器</h1>
        <button id="connectBtn">🔌 點我連線 Arduino 搖桿</button>
        <div id="status" class="status">等待連線中...</div>
        <p style="color: #94a3b8; text-align: left;">【安全遊玩說明】<br>1. 點擊連線並選取 Arduino。<br>2. <b>滑鼠點一下本網頁空白處，保持網頁在最上層</b>。<br>3. 在電腦上按下 <b>Alt + Tab</b> 切換到 Roblox 遊戲視窗（不要用滑鼠點Roblox，用鍵盤切換才能保持網頁在背景發送真訊號）。</p>
        <div id="log" class="log"></div>
    </div>

    <script>
        let port, reader;
        const logDiv = document.getElementById("log");
        const statusDiv = document.getElementById("status");

        function addLog(msg) { logDiv.innerHTML += msg + "<br>"; logDiv.scrollTop = logDiv.scrollHeight; }

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                document.getElementById('connectBtn').style.display = "none";
                statusDiv.innerText = "🟢 高權限外掛已啟動！";
                statusDiv.style.color = "#22c55e";
                addLog("[系統] 網頁已獲得序列埠高權限，開始同步...");
                readLoop();
            } catch (err) { addLog("[錯誤] " + err); }
        });

        // 突破沙盒限制：利用 window 頂層核心分發電氣事件
        function sendTrueKey(key) {
            const eDown = new KeyboardEvent("keydown", { key: key, code: "Key"+key.toUpperCase(), bubbles: true, cancelable: true });
            const eUp = new KeyboardEvent("keyup", { key: key, code: "Key"+key.toUpperCase(), bubbles: true, cancelable: true });
            document.dispatchEvent(eDown);
            setTimeout(() => document.dispatchEvent(eUp), 30);
        }

        async function readLoop() {
            const textDecoder = new TextDecoderStream();
            port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();
            let buffer = "";

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buffer += value;
                if (buffer.includes("\n")) {
                    let command = buffer.trim();
                    if (command.startsWith("KEY_")) {
                        let keyChar = command.replace("KEY_", "").toLowerCase();
                        addLog("[發射] 模擬真鍵盤訊號: " + keyChar.toUpperCase());
                        sendTrueKey(keyChar);
                    }
                    buffer = "";
                }
            }
        }
    </script>
</body>
</html>
